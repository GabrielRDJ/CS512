<body>

  <!-- MAKE SURE YOU UPDATE YOUR EDITS HERE -->
  <!-- Vertex Shader -->
  <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
  in vec3 aPosition;
  in vec3 aColor;

  uniform float uTime; //time in sec
  out vec3 vColor;
  out float opacity; // From HW1

  // Transformation Vertices
  uniform vec3 uTranslation, uScaling, uShearing, uReflecting;
  // Matrix
  uniform mat3 uMatrix, uRotation;

  void main() {
    vec3 p = aPosition;
    p = uMatrix * p;
    p += uTranslation;
    
    /* From HW1:
    if(gl_VertexID == 0) {
      p.x += 0.75 * cos(uTime);
    }
    if(gl_VertexID == 1) {
      p.y += 0.5 * sin(uTime);
    }
    if(gl_VertexID == 2) {
      p.x += 0.75 * sin(uTime-0.5);
      p.y += 0.25 * cos(uTime);
    }
    */
    
    gl_Position = vec4(p, 10.0); // The larger second value is, the smaller the image becomes;   From HW1
    // gl_Position = vec4(uMatrix * p, 10.0);
    
    opacity = sin(uTime * 5.0) * 0.5 + 0.5; // From HW1
    vColor = aColor;
  }
  </script>

  <!-- MAKE SURE YOU UPDATE YOUR EDITS HERE -->
  <!-- Fragment Shader -->
  <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
  precision mediump float;
  in vec3 vColor;
  // in float opacity; // From HW1

  out vec4 fragColor;

  void main() {
    fragColor = vec4(vColor, 1);
    // fragColor = vec4(vColor, opacity); // From HW1
  }
  </script>

  <script src="GRDJ - triangle-1.js"></script>

  <script>
    function createShader(gl, type, source) {
      let shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      let vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
      let fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
      let prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog));
      }
      return prog;
    }


    // --- WebGL init ---
    const canvas = document.getElementById("glcanvas");
    // const gl = canvas.getContext("webgl2");
    const gl = canvas.getContext("webgl2", { premultipliedAlpha: false });
    if (!gl) alert("WebGL2 not supported");

    //alpha transparency
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    // --- HW2: Transformations ---
    var twoDHomogeneousTransform = {
      translation: function (tx, ty) {
        return [
          1, 0, tx,
          0, 1, ty,
          0, 0,  1
        ];
      },

      rotation: function (angle) {
        var cosine = Math.cos(angle);
        var sine = Math.sin(angle);
        return [
          cosine, -sine, 0,
          sine,  cosine, 0,
          0,  0,  1
        ];
      },

      scaling: function (sx, sy) {
        return [
          sx, 0,  0,
          0, sy,  0,
          0,  0,  1
        ];
      },

      shearing: function (shx, shy) {
        return [
          1, shx, 0,
          shy, 1, 0,
          0,  0,  1
        ];
      },

      reflection: function (axis) {
        if (axis == "x") {
          return [
            1,  0, 0,
            0, -1, 0,
            0,  0, 1
          ];
        } else if (axis == "y") {
          return [
            -1, 0, 0,
             0, 1, 0,
             0, 0, 1
          ];
        } else if (axis == "y=x") {
          return [
            0, 1, 0,
            1, 0, 0,
            0, 0, 1
          ];
        } else { // Reflect across y = -x
          return [
             0, -1, 0,
            -1,  0, 0,
             0,  0, 1
          ];
        }
      },

      identity: function () {
        return [
           1, 0, 0,
           0, 1, 0,
           0, 0, 1
        ]
      }
    }

    const vsEditor = document.getElementById("vsEditor");
    const fsEditor = document.getElementById("fsEditor");
    vsEditor.value = document.getElementById("vertex-shader").textContent;
    fsEditor.value = document.getElementById("fragment-shader").textContent;

    let program, posLoc, colorLoc, timeLoc;
    let posBuffer, colorBuffer, matrixLoc;
    let transLoc, scaleLoc, rotLoc, reflectLoc, shearLoc;

    // --- Buffers ---
    function initBuffers() {
      posBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

      colorBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
    }

    initBuffers();

    function initShaderProgram() {
      try {
        program = createProgram(gl, vsEditor.value, fsEditor.value);
        gl.useProgram(program);
        posLoc = gl.getAttribLocation(program, "aPosition");
        colorLoc = gl.getAttribLocation(program, "aColor");
        timeLoc = gl.getUniformLocation(program, "uTime");
        matrixLoc = gl.getUniformLocation(program, "uMatrix");
        transLoc = gl.getUniformLocation(program, "uTranslation");
        scaleLoc = gl.getUniformLocation(program, "uScaling");
        rotLoc = gl.getUniformLocation(program, "uRotation");
        reflectLoc = gl.getUniformLocation(program, "uReflecting");
        shearLoc = gl.getUniformLocation(program, "uShearing");
      } catch (e) { console.error(e); }
    }

    initShaderProgram();

    function matrixMult(a, b) {
      let result = [];
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          let sum = 0;
          for (let i = 0; i < 3; i++) {
            sum += a[row * 3 + i] * b[i * 3 + col];
          }
        result[row * 3 + col] = sum;
        }
      }
      return result;
    }


    //hot compile when any input in the playground text area
    vsEditor.onkeyup = initShaderProgram;
    fsEditor.onkeyup = initShaderProgram;

    let startTime = Date.now();
    function render() {
      let primitiveType = gl.TRIANGLES;
      let offset = 0;
      let count = 6;

      //clear the canvas
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);

      // Position buffer binding
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

      // Color buffer binding
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.enableVertexAttribArray(colorLoc);
      gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

      //delta time in ms
      let deltaTime = Date.now() - startTime;
      //set time in seconds
      gl.uniform1f(timeLoc, deltaTime/1000.0);

      // Transformation setup
      const tx = Math.sin(deltaTime * 0.001) * 8.0; // oscilate on x
      const ty = 0.0;
      const tz = 0.0;
      gl.uniform3f(transLoc, tx, ty, tz);
      
      const sx = 0.0;
      const sy = 0.0;
      const sz = 0.0;
      gl.uniform3f(scaleLoc, sx, sy, sz);
      
      const rox = deltaTime * 0.001;
      const roy = 0.0;
      const roz = 0.0;
      gl.uniform3f(rotLoc, rox, roy, roz);
      
      const rex = "x";
      const rey = 0.0;
      const rez = 0.0;
      gl.uniform3f(reflectLoc, rex, rey, rez);
      
      const shx = 0.0;
      const shy = 0.0;
      const shz = 0.0;
      gl.uniform3f(shearLoc, shx, shy, shz);
      
    const transMat = twoDHomogeneousTransform.translation(tx, ty);
    const rotMat = twoDHomogeneousTransform.rotation(rox);
    const scaleMat = twoDHomogeneousTransform.scaling(sx, sy);
    const refMat = twoDHomogeneousTransform.reflection(rex);
    const shearMat = twoDHomogeneousTransform.shearing(shx, shy);
    // Combined matrix transformations
    const combinedMatrix = matrixMult(transMat, rotMat); // Translate and Rotate
    gl.uniformMatrix3fv(matrixLoc, false, combinedMatrix);

      // Draw content
      // gl.drawArrays(gl.TRIANGLES, 0, 3); // From HW1
      gl.drawArrays(primitiveType, offset, count);
    }

    // Initialize when page loads
    window.onload = function () {
      setInterval(render, 30);
    };
  </script>
